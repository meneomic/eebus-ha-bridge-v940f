# Publishes a BRANCH-SCOPED, keyless-signed candidate image, NOT an add-on
# release. Production is not touched; a human must pin the digest separately.
name: Vaillant preview image (not deployed)

on:
  push:
    branches:
      - feat/vaillant-rc-preview
      - release/vaillant-preview-0.18.2-rc1
    paths:
      - 'eebus-bridge/**'
      - 'scripts/smoke-image.sh'
      - '.github/workflows/vaillant-preview-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-amd64:
    if: github.repository == 'meneomic/eebus-ha-bridge-v940f' && (github.ref == 'refs/heads/feat/vaillant-rc-preview' || github.ref == 'refs/heads/release/vaillant-preview-0.18.2-rc1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build isolated AMD64 image for smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./eebus-bridge
          platforms: linux/amd64
          load: true
          push: false
          tags: eebus-bridge:vaillant-smoke
          build-args: |
            BUILD_VERSION=vaillant-${{ github.sha }}
      - name: Smoke-test patched image
        run: bash scripts/smoke-image.sh eebus-bridge:vaillant-smoke
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish candidate image with unique commit tag
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./eebus-bridge
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eebus-bridge:vaillant-${{ github.sha }}
          build-args: |
            BUILD_VERSION=vaillant-${{ github.sha }}
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign exact image digest using GitHub OIDC
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/eebus-bridge@${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"
      - name: Verify signer identity and digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/eebus-bridge@${{ steps.publish.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/vaillant-preview-image.yml@${{ github.ref }}
        run: |
          cosign verify --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}" >/dev/null
      - name: Record digest and provenance for review
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          printf 'git_commit=%s\nimage=ghcr.io/meneomic/eebus-bridge@%s\n' "${SHA}" "${DIGEST}" > image-provenance.txt
          cat image-provenance.txt >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload nonsecret image provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vaillant-image-provenance
          path: image-provenance.txt
          retention-days: 7
          if-no-files-found: error
