# Branch-scoped regression check: Vaillant ecoTEC without MPC.
# This workflow does not publish images, change add-ons or touch live HA.
name: Vaillant heating discovery regression (review only)

on:
  push:
    branches:
      - fix/vaillant-spine-discovery-heating
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: eebus-bridge/go.sum
      - name: Verify event callbacks and complete bridge
        working-directory: eebus-bridge
        run: |
          go vet ./...
          go test -race ./internal/eebus/... ./internal/usecases/... ./cmd/eebus-bridge/...
